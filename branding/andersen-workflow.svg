<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">Az Andersen alkotói munkafolyamata</title>
  <desc id="desc">Öt összekapcsolt alkotói terület: kézirat, karakterek, világépítés, történettervezés és publikálás.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#192A40"/><stop offset="1" stop-color="#101A2B"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F3D99B"/><stop offset="1" stop-color="#B98643"/></linearGradient>
  </defs>
  <rect width="1200" height="330" rx="24" fill="#0B1220"/>
  <text x="600" y="48" text-anchor="middle" fill="#F3E7CE" font-family="Georgia,serif" font-size="27" font-weight="700">Egy történet. Öt összekapcsolt alkotói dimenzió.</text>
  <g stroke="#B99355" stroke-width="2" stroke-opacity=".7" fill="none"><path d="M215 174H985"/><path d="M215 174l12 -7v14zM985 174l-12 -7v14z" fill="#B99355"/></g>
  <g font-family="Arial,sans-serif" text-anchor="middle">
