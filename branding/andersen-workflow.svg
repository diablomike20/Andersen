    </g>
    <g transform="translate(285 92)">
      <rect width="190" height="164" rx="18" fill="url(#panel)" stroke="#C69E5B" stroke-opacity=".55"/>
      <circle cx="95" cy="48" r="26" fill="#D6B36D" fill-opacity=".13" stroke="url(#accent)"/>
      <circle cx="95" cy="42" r="9" fill="none" stroke="#F0D89F" stroke-width="2"/><path d="M78 65c2-13 32-13 34 0" fill="none" stroke="#F0D89F" stroke-width="2"/>
      <text x="95" y="105" fill="#FFF4DC" font-size="17" font-weight="700">Karakterek</text><text x="95" y="129" fill="#AEBBCD" font-size="12">Akik életre keltik</text>
    </g>
    <g transform="translate(515 92)">
      <rect width="190" height="164" rx="18" fill="url(#panel)" stroke="#C69E5B" stroke-opacity=".55"/>
      <circle cx="95" cy="48" r="26" fill="#D6B36D" fill-opacity=".13" stroke="url(#accent)"/>
