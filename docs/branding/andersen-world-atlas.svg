<svg viewBox="0 0 1600 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Fantáziatérkép az Andersen világépítési eszközeinek szemléltetésére">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1220"/>
      <stop offset="100%" stop-color="#172A42"/>
    </linearGradient>
    <radialGradient id="mapGlow" cx="50%" cy="46%" r="60%">
      <stop offset="0%" stop-color="#D6B36D" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#D6B36D" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0 L0 0 0 48" fill="none" stroke="#2A3C58" stroke-width="0.6" opacity="0.5"/>
    </pattern>
  </defs>
  <rect width="1600" height="640" fill="url(#bg4)"/>
  <rect width="1600" height="640" fill="url(#mapGlow)"/>
  <rect x="140" y="80" width="1320" height="480" fill="url(#grid)" opacity="0.6"/>
  <rect x="140" y="80" width="1320" height="480" fill="none" stroke="#D6B36D" stroke-width="2" opacity="0.5"/>
  <rect x="124" y="64" width="1352" height="512" fill="none" stroke="#8A6A2E" stroke-width="1" opacity="0.4"/>

  <!-- landmasses -->
  <g opacity="0.95">
    <path d="M260 220 C 320 170 420 170 470 210 C 520 250 500 320 450 350 C 500 360 540 410 500 460 C 450 500 360 500 320 460 C 260 480 210 440 220 380 C 170 360 180 290 230 260 Z"
          fill="#1B2E48" stroke="#D6B36D" stroke-width="1.6"/>
    <path d="M820 150 C 900 130 980 160 1000 210 C 1020 260 980 300 920 300 C 960 330 960 390 900 410 C 840 430 780 400 770 350 C 720 340 700 290 740 250 C 720 210 760 170 820 150 Z"
          fill="#223454" stroke="#D6B36D" stroke-width="1.6"/>
    <path d="M1140 330 C 1220 310 1300 340 1320 390 C 1340 440 1290 480 1230 470 C 1250 510 1210 550 1150 540 C 1090 530 1060 480 1080 440 C 1040 420 1050 370 1100 350 Z"
          fill="#1B2E48" stroke="#D6B36D" stroke-width="1.6"/>
  </g>

  <!-- mountains -->
  <g fill="#0E1A30" stroke="#D6B36D" stroke-width="1" opacity="0.9">
    <path d="M330 260 l20 -34 l16 24 l18 -30 l16 40 Z"/>
    <path d="M870 220 l18 -30 l14 20 l16 -26 l14 36 Z"/>
  </g>

  <!-- forest dots -->
  <g fill="#3A5A3E" opacity="0.8">
    <circle cx="420" cy="420" r="5"/><circle cx="436" cy="412" r="5"/><circle cx="408" cy="406" r="5"/>
    <circle cx="950" cy="360" r="5"/><circle cx="966" cy="352" r="5"/><circle cx="938" cy="346" r="5"/>
  </g>

  <!-- trade route dotted lines -->
  <path d="M400 300 Q 650 200 900 260 T 1200 400" fill="none" stroke="#D6B36D" stroke-width="1.4" stroke-dasharray="2 8" opacity="0.8"/>

  <!-- map pins -->
  <g>
    <g transform="translate(380 310)">
      <path d="M0 0 C -14 -14 -14 -34 0 -46 C 14 -34 14 -14 0 0 Z" fill="#C0392B" stroke="#F3E0B4" stroke-width="1.4"/>
      <circle cy="-30" r="5" fill="#F6EFDD"/>
    </g>
    <g transform="translate(900 230)">
      <path d="M0 0 C -14 -14 -14 -34 0 -46 C 14 -34 14 -14 0 0 Z" fill="#C0392B" stroke="#F3E0B4" stroke-width="1.4"/>
      <circle cy="-30" r="5" fill="#F6EFDD"/>
    </g>
    <g transform="translate(1180 410)">
      <path d="M0 0 C -14 -14 -14 -34 0 -46 C 14 -34 14 -14 0 0 Z" fill="#C0392B" stroke="#F3E0B4" stroke-width="1.4"/>
      <circle cy="-30" r="5" fill="#F6EFDD"/>
    </g>
  </g>

  <!-- sea monster flourish -->
  <g transform="translate(680 500)" opacity="0.75" stroke="#2A3C58" stroke-width="2" fill="none">
    <path d="M-40 0 Q -20 -24 0 0 T 40 0" />
    <path d="M40 0 l10 -10 M40 0 l6 12"/>
  </g>

  <!-- compass rose -->
  <g transform="translate(1340 480)">
    <circle r="62" fill="#0E1A30" stroke="#D6B36D" stroke-width="2"/>
    <circle r="46" fill="none" stroke="#D6B36D" stroke-width="1" opacity="0.6"/>
    <g fill="#D6B36D">
      <path d="M0 -58 L10 -14 L0 -22 L-10 -14 Z"/>
      <path d="M0 58 L10 14 L0 22 L-10 14 Z" opacity="0.6"/>
      <path d="M58 0 L14 10 L22 0 L14 -10 Z" opacity="0.6"/>
      <path d="M-58 0 L-14 10 L-22 0 L-14 -10 Z" opacity="0.6"/>
    </g>
    <text x="0" y="-70" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#F3E0B4">É</text>
    <text x="0" y="82" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#8FA3C0">D</text>
    <text x="78" y="5" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#8FA3C0">K</text>
    <text x="-78" y="5" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#8FA3C0">NY</text>
  </g>

  <text x="800" y="612" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="17" fill="#8FA3C0">
    helyszínek, kultúrák és történelem — egyetlen következetes világ
  </text>
</svg>
