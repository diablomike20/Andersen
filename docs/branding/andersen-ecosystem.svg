<svg viewBox="0 0 1600 740" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Az Andersen teljes alkotói ökoszisztémája">
  <defs>
    <linearGradient id="bg7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1220"/>
      <stop offset="100%" stop-color="#172A42"/>
    </linearGradient>
    <radialGradient id="hubGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D6B36D" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#D6B36D" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nodeGlow7" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D6B36D" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#D6B36D" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="740" fill="url(#bg7)"/>

  <!-- connecting spokes -->
  <g stroke="#D6B36D" stroke-width="1.4" opacity="0.5">
    <line x1="800" y1="390" x2="800" y2="150"/>
    <line x1="800" y1="390" x2="1003" y2="248"/>
    <line x1="800" y1="390" x2="1054" y2="468"/>
    <line x1="800" y1="390" x2="913" y2="644"/>
    <line x1="800" y1="390" x2="687" y2="644"/>
    <line x1="800" y1="390" x2="546" y2="468"/>
    <line x1="800" y1="390" x2="597" y2="248"/>
  </g>
  <!-- outer ring -->
  <circle cx="800" cy="390" r="260" fill="none" stroke="#2A3C58" stroke-width="1" stroke-dasharray="2 10" opacity="0.7"/>

  <!-- central hub -->
  <g transform="translate(800 390)">
    <circle r="100" fill="url(#hubGlow)"/>
    <circle r="78" fill="#0E1A30" stroke="#D6B36D" stroke-width="2.4"/>
    <circle r="64" fill="none" stroke="#D6B36D" stroke-width="1" opacity="0.5"/>
    <text y="-4" text-anchor="middle" font-family="Georgia, serif" font-size="22" letter-spacing="2" fill="url(#goldTextEco)" >ANDERSEN</text>
    <defs>
      <linearGradient id="goldTextEco" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#F3E0B4"/>
        <stop offset="100%" stop-color="#C79A50"/>
      </linearGradient>
    </defs>
    <text y="20" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#8FA3C0">alkotói mag</text>
  </g>

  <!-- node template function manually repeated -->
  <!-- 1 top: Kéziratírás -->
  <g transform="translate(800 150)">
    <circle r="62" fill="url(#nodeGlow7)"/>
    <circle r="44" fill="#172A42" stroke="#D6B36D" stroke-width="1.6"/>
    <g stroke="#F3E0B4" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="-14" y="-16" width="28" height="32" rx="3" fill="none"/>
      <line x1="-8" y1="-8" x2="8" y2="-8"/>
      <line x1="-8" y1="0" x2="8" y2="0"/>
      <line x1="-8" y1="8" x2="4" y2="8"/>
    </g>
    <text y="64" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="600" fill="#F3E0B4">Kéziratírás</text>
  </g>

  <!-- 2: Világépítés -->
  <g transform="translate(1003 248)">
    <circle r="62" fill="url(#nodeGlow7)"/>
    <circle r="44" fill="#172A42" stroke="#D6B36D" stroke-width="1.6"/>
    <g stroke="#F3E0B4" stroke-width="1.6" fill="none">
      <circle r="15"/>
      <path d="M-15 0 H15 M0 -15 V15 M-11 -9 Q0 -3 11 -9 M-11 9 Q0 3 11 9" stroke-width="1.1"/>
    </g>
    <text y="64" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="600" fill="#F3E0B4">Világépítés</text>
  </g>

  <!-- 3: Karakterek -->
  <g transform="translate(1054 468)">
    <circle r="62" fill="url(#nodeGlow7)"/>
    <circle r="44" fill="#172A42" stroke="#D6B36D" stroke-width="1.6"/>
    <g stroke="#F3E0B4" stroke-width="1.8" fill="none" stroke-linecap="round">
      <circle r="8" cx="-8" cy="-8"/>
      <circle r="8" cx="8" cy="-4"/>
      <path d="M-18 14 C -18 0 -10 -2 -8 -2" />
      <path d="M-2 16 C -2 0 8 4 8 4 C 18 4 18 16 18 16"/>
    </g>
    <text y="64" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="600" fill="#F3E0B4">Karakterek</text>
  </g>

  <!-- 4: Cselekmény -->
  <g transform="translate(913 644)">
    <circle r="62" fill="url(#nodeGlow7)"/>
    <circle r="44" fill="#172A42" stroke="#D6B36D" stroke-width="1.6"/>
    <path d="M-16 10 Q -4 -16 16 -10" stroke="#F3E0B4" stroke-width="2" fill="none" stroke-linecap="round"/>
    <circle cx="-16" cy="10" r="3" fill="#F3E0B4"/>
    <circle cx="16" cy="-10" r="3" fill="#F3E0B4"/>
    <circle cx="2" cy="-10" r="3" fill="#F3E0B4" opacity="0.8"/>
    <text y="64" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="600" fill="#F3E0B4">Cselekmény</text>
  </g>

  <!-- 5: Kutatás és szerkesztés -->
  <g transform="translate(687 644)">
    <circle r="62" fill="url(#nodeGlow7)"/>
    <circle r="44" fill="#172A42" stroke="#D6B36D" stroke-width="1.6"/>
    <g stroke="#F3E0B4" stroke-width="1.8" fill="none" stroke-linecap="round">
      <circle r="11" cx="-4" cy="-4"/>
      <line x1="5" y1="5" x2="15" y2="15"/>
    </g>
    <text y="64" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#F3E0B4">Kutatás</text>
  </g>

  <!-- 6: Haladáskövetés -->
  <g transform="translate(546 468)">
    <circle r="62" fill="url(#nodeGlow7)"/>
    <circle r="44" fill="#172A42" stroke="#D6B36D" stroke-width="1.6"/>
    <g stroke="#F3E0B4" stroke-width="1.8" fill="none" stroke-linecap="round">
      <rect x="-16" y="-14" width="7" height="28"/>
      <rect x="-4" y="-6" width="7" height="20"/>
      <rect x="8" y="-18" width="7" height="32"/>
    </g>
    <text y="64" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#F3E0B4">Haladás</text>
  </g>

  <!-- 7: Export -->
  <g transform="translate(597 248)">
    <circle r="62" fill="url(#nodeGlow7)"/>
    <circle r="44" fill="#172A42" stroke="#D6B36D" stroke-width="1.6"/>
    <g stroke="#F3E0B4" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0 10 V -12 M-8 -4 L0 -12 L8 -4"/>
      <path d="M-14 14 H14"/>
    </g>
    <text y="64" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="600" fill="#F3E0B4">Export</text>
  </g>
</svg>
