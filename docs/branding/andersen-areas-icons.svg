<svg viewBox="0 0 1600 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Az Andersen hét alkotói területének ikonsora">
  <defs>
    <linearGradient id="bgAI" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1220"/>
      <stop offset="100%" stop-color="#172A42"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="220" fill="url(#bgAI)"/>
  <line x1="80" y1="70" x2="1520" y2="70" stroke="#2A3C58" stroke-width="1" opacity="0.7"/>

  <g font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#CBD6E8" text-anchor="middle">
    <!-- Kéziratírás -->
    <g transform="translate(140 70)">
      <circle r="38" fill="#0E1A30" stroke="#D6B36D" stroke-width="1.6"/>
      <g stroke="#F3E0B4" stroke-width="1.6" fill="none" stroke-linecap="round" transform="translate(0 -2)">
        <rect x="-12" y="-13" width="24" height="26" rx="2"/>
        <line x1="-7" y1="-6" x2="7" y2="-6"/>
        <line x1="-7" y1="0" x2="7" y2="0"/>
        <line x1="-7" y1="6" x2="3" y2="6"/>
      </g>
      <text y="60">Kéziratírás</text>
    </g>
    <!-- Világépítés -->
    <g transform="translate(360 70)">
      <circle r="38" fill="#0E1A30" stroke="#D6B36D" stroke-width="1.6"/>
      <g stroke="#F3E0B4" stroke-width="1.4" fill="none" transform="translate(0 -2)">
        <circle r="13"/>
        <path d="M-13 0 H13 M0 -13 V13 M-9 -7 Q0 -2 9 -7 M-9 7 Q0 2 9 7"/>
      </g>
      <text y="60">Világépítés</text>
    </g>
    <!-- Karakterek -->
    <g transform="translate(580 70)">
      <circle r="38" fill="#0E1A30" stroke="#D6B36D" stroke-width="1.6"/>
      <g stroke="#F3E0B4" stroke-width="1.6" fill="none" stroke-linecap="round" transform="translate(0 -4)">
        <circle r="7" cx="-7" cy="-6"/>
        <circle r="7" cx="7" cy="-3"/>
        <path d="M-16 13 C -16 0 -9 -2 -7 -2"/>
        <path d="M-2 15 C -2 0 7 3 7 3 C 16 3 16 13 16 13"/>
      </g>
      <text y="60">Karakterek</text>
    </g>
    <!-- Cselekmény -->
    <g transform="translate(800 70)">
      <circle r="38" fill="#0E1A30" stroke="#D6B36D" stroke-width="1.6"/>
      <g transform="translate(0 -2)">
        <path d="M-14 10 Q -3 -14 14 -9" stroke="#F3E0B4" stroke-width="1.8" fill="none" stroke-linecap="round"/>
        <circle cx="-14" cy="10" r="2.6" fill="#F3E0B4"/>
        <circle cx="14" cy="-9" r="2.6" fill="#F3E0B4"/>
        <circle cx="1" cy="-9" r="2.6" fill="#F3E0B4" opacity="0.8"/>
      </g>
      <text y="60">Cselekmény</text>
    </g>
    <!-- Kutatás és szerkesztés -->
    <g transform="translate(1020 70)">
      <circle r="38" fill="#0E1A30" stroke="#D6B36D" stroke-width="1.6"/>
      <g stroke="#F3E0B4" stroke-width="1.6" fill="none" stroke-linecap="round" transform="translate(0 -2)">
        <circle r="9" cx="-3" cy="-3"/>
        <line x1="4" y1="4" x2="12" y2="12"/>
      </g>
      <text y="60">
        <tspan x="0">Kutatás &amp;</tspan>
        <tspan x="0" dy="14">szerkesztés</tspan>
      </text>
    </g>
    <!-- Haladáskövetés -->
    <g transform="translate(1250 70)">
      <circle r="38" fill="#0E1A30" stroke="#D6B36D" stroke-width="1.6"/>
      <g stroke="#F3E0B4" stroke-width="1.6" fill="none" stroke-linecap="round" transform="translate(0 -2)">
        <rect x="-13" y="-9" width="5.5" height="20"/>
        <rect x="-3" y="-3" width="5.5" height="14"/>
        <rect x="7" y="-14" width="5.5" height="25"/>
      </g>
      <text y="60">Haladáskövetés</text>
    </g>
    <!-- Export -->
    <g transform="translate(1460 70)">
      <circle r="38" fill="#0E1A30" stroke="#D6B36D" stroke-width="1.6"/>
      <g stroke="#F3E0B4" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(0 -2)">
        <path d="M0 8 V-10 M-7 -3 L0 -10 L7 -3"/>
        <path d="M-11 11 H11"/>
      </g>
      <text y="60">
        <tspan x="0">Export &amp;</tspan>
        <tspan x="0" dy="14">publikálás</tspan>
      </text>
    </g>
  </g>
</svg>
