<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d">
<title id="t">Az Andersen alkotói folyamata</title><desc id="d">Öt elegáns, összekapcsolt állomás: ötlet, felfedezés, építés, finomítás és megosztás.</desc>
