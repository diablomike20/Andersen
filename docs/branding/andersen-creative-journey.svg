<g transform="translate(515 83)"><circle cx="70" cy="62" r="45" fill="#D8B66F" fill-opacity=".08" stroke="url(#gold)" stroke-width="2"/><path d="M47 80l23-38 23 38zM70 42v55M47 80h46" fill="none" stroke="#F2DDAA" stroke-width="2"/><text x="70" y="140" fill="#FFF0D1" font-size="16" font-weight="700">Építés</text><text x="70" y="162" fill="#AAB9CA" font-size="11">A történet formálása</text></g>
