<svg viewBox="0 0 1600 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Prémium grafikai illusztráció az Andersen kéziratíró műhelyéről">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1220"/>
      <stop offset="100%" stop-color="#172A42"/>
    </linearGradient>
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F6EFDD"/>
      <stop offset="100%" stop-color="#E7DAB8"/>
    </linearGradient>
    <linearGradient id="coverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2A3C58"/>
      <stop offset="100%" stop-color="#14233A"/>
    </linearGradient>
    <radialGradient id="deskGlow" cx="50%" cy="60%" r="60%">
      <stop offset="0%" stop-color="#D6B36D" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#D6B36D" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft3"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>
  <rect width="1600" height="640" fill="url(#bg3)"/>
  <ellipse cx="800" cy="430" rx="620" ry="220" fill="url(#deskGlow)"/>

  <!-- open book -->
  <g transform="translate(800 400)">
    <path d="M-10 -140 C -140 -170 -260 -150 -330 -110 L -330 120 C -260 80 -140 60 -10 90 Z" fill="url(#coverGrad)" stroke="#0A1220" stroke-width="2"/>
    <path d="M10 -140 C 140 -170 260 -150 330 -110 L 330 120 C 260 80 140 60 10 90 Z" fill="url(#coverGrad)" stroke="#0A1220" stroke-width="2"/>
    <path d="M-10 -140 C -140 -170 -260 -150 -320 -112 L -320 108 C -250 72 -135 54 -10 82 Z" fill="url(#pageGrad)"/>
    <path d="M10 -140 C 140 -170 260 -150 320 -112 L 320 108 C 250 72 135 54 10 82 Z" fill="url(#pageGrad)"/>
    <!-- spine -->
    <rect x="-6" y="-146" width="12" height="244" fill="#0E1A30"/>
    <!-- text lines left page -->
    <g stroke="#9C8A63" stroke-width="2.2" stroke-linecap="round" opacity="0.75">
      <line x1="-290" y1="-90" x2="-60" y2="-72"/>
      <line x1="-290" y1="-66" x2="-60" y2="-50"/>
      <line x1="-290" y1="-42" x2="-120" y2="-30"/>
      <line x1="-290" y1="-10" x2="-60" y2="2"/>
      <line x1="-290" y1="14" x2="-60" y2="24"/>
      <line x1="-290" y1="38" x2="-100" y2="44"/>
    </g>
    <!-- text lines right page -->
    <g stroke="#9C8A63" stroke-width="2.2" stroke-linecap="round" opacity="0.75">
      <line x1="60" y1="-72" x2="290" y2="-90"/>
      <line x1="60" y1="-50" x2="290" y2="-66"/>
      <line x1="60" y1="-30" x2="230" y2="-42"/>
      <line x1="60" y1="2" x2="290" y2="-10"/>
      <line x1="60" y1="24" x2="290" y2="14"/>
      <line x1="60" y1="44" x2="250" y2="38"/>
    </g>
    <!-- gold chapter marker -->
    <circle cx="0" cy="-104" r="5" fill="#D6B36D"/>
  </g>

  <!-- feather resting on book -->
  <g transform="translate(1000 360) rotate(28)">
    <path d="M0 0 C 22 -50 16 -96 -8 -128 C -2 -92 -2 -56 -14 -24 C -20 -8 -28 4 -38 12 L -24 -4 C -30 2 -36 6 -42 10 L -28 -6 C -8 -22 6 -50 0 0 Z" fill="#F3E0B4" stroke="#B8914A" stroke-width="1"/>
  </g>

  <!-- floating chapter tags, left -->
  <g font-family="'Segoe UI', Arial, sans-serif" font-size="15" fill="#CBD6E8">
    <g transform="translate(230 220)">
      <rect x="-70" y="-22" width="140" height="44" rx="10" fill="#0E1A30" stroke="#D6B36D" stroke-width="1" opacity="0.9"/>
      <text x="0" y="5" text-anchor="middle" fill="#F3E0B4" font-weight="600">1. fejezet</text>
      <line x1="70" y1="0" x2="470" y2="260" stroke="#D6B36D" stroke-width="1" opacity="0.35" stroke-dasharray="3 6"/>
    </g>
    <g transform="translate(200 520)">
      <rect x="-80" y="-22" width="160" height="44" rx="10" fill="#0E1A30" stroke="#D6B36D" stroke-width="1" opacity="0.9"/>
      <text x="0" y="5" text-anchor="middle" fill="#F3E0B4" font-weight="600">Helyszínek</text>
      <line x1="80" y1="-6" x2="470" y2="-120" stroke="#D6B36D" stroke-width="1" opacity="0.35" stroke-dasharray="3 6"/>
    </g>
  </g>

  <!-- floating chapter tags, right -->
  <g font-family="'Segoe UI', Arial, sans-serif" font-size="15" fill="#CBD6E8">
    <g transform="translate(1370 220)">
      <rect x="-80" y="-22" width="160" height="44" rx="10" fill="#0E1A30" stroke="#D6B36D" stroke-width="1" opacity="0.9"/>
      <text x="0" y="5" text-anchor="middle" fill="#F3E0B4" font-weight="600">Karakterek</text>
      <line x1="-80" y1="0" x2="-470" y2="260" stroke="#D6B36D" stroke-width="1" opacity="0.35" stroke-dasharray="3 6"/>
    </g>
    <g transform="translate(1400 520)">
      <rect x="-80" y="-22" width="160" height="44" rx="10" fill="#0E1A30" stroke="#D6B36D" stroke-width="1" opacity="0.9"/>
      <text x="0" y="5" text-anchor="middle" fill="#F3E0B4" font-weight="600">Jegyzetek</text>
      <line x1="-80" y1="-6" x2="-470" y2="-120" stroke="#D6B36D" stroke-width="1" opacity="0.35" stroke-dasharray="3 6"/>
    </g>
  </g>

  <text x="800" y="605" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="17" fill="#8FA3C0">
    minden fejezet, jelenet és jegyzet — egyetlen összefüggő kézirat
  </text>
</svg>
