<svg viewBox="0 0 1600 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Andersen — Ne csak történeteket írj. Teremts világokat.">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1220"/>
      <stop offset="52%" stop-color="#0E1A30"/>
      <stop offset="100%" stop-color="#172A42"/>
    </linearGradient>
    <radialGradient id="glowGold" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#D6B36D" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#D6B36D" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#D6B36D" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F3E0B4"/>
      <stop offset="50%" stop-color="#D6B36D"/>
      <stop offset="100%" stop-color="#C79A50"/>
    </linearGradient>
    <linearGradient id="penGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E0B4"/>
      <stop offset="100%" stop-color="#B8914A"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="starBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="0.6"/>
    </filter>
  </defs>

  <rect width="1600" height="560" fill="url(#bgGrad)"/>
  <rect width="1600" height="560" fill="url(#glowGold)"/>

  <!-- starfield / constellation -->
  <g opacity="0.75">
    <circle cx="120" cy="90" r="1.6" fill="#F3E0B4" filter="url(#starBlur)"/>
    <circle cx="210" cy="150" r="1.1" fill="#CFE0FF" filter="url(#starBlur)"/>
    <circle cx="90" cy="230" r="1.3" fill="#F3E0B4" filter="url(#starBlur)"/>
    <circle cx="300" cy="80" r="1" fill="#CFE0FF" filter="url(#starBlur)"/>
    <circle cx="1420" cy="100" r="1.4" fill="#F3E0B4" filter="url(#starBlur)"/>
    <circle cx="1500" cy="180" r="1.1" fill="#CFE0FF" filter="url(#starBlur)"/>
    <circle cx="1350" cy="60" r="1" fill="#CFE0FF" filter="url(#starBlur)"/>
    <circle cx="1470" cy="260" r="1.3" fill="#F3E0B4" filter="url(#starBlur)"/>
    <circle cx="60" cy="420" r="1.2" fill="#CFE0FF" filter="url(#starBlur)"/>
    <circle cx="1540" cy="430" r="1.2" fill="#F3E0B4" filter="url(#starBlur)"/>
    <path d="M90 230 L120 90 M120 90 L210 150 M210 150 L300 80" stroke="#8FA3C0" stroke-width="0.6" opacity="0.35"/>
    <path d="M1420 100 L1350 60 M1420 100 L1500 180 M1500 180 L1470 260" stroke="#8FA3C0" stroke-width="0.6" opacity="0.35"/>
  </g>

  <!-- ornamental corner flourishes -->
  <g stroke="#D6B36D" stroke-width="1.3" fill="none" opacity="0.55">
    <path d="M70 60 h70 M70 60 v70"/>
    <path d="M70 70 q20 -2 28 18" />
    <path d="M1530 60 h-70 M1530 60 v70"/>
    <path d="M1530 70 q-20 -2 -28 18" />
    <path d="M70 500 h70 M70 500 v-70"/>
    <path d="M70 490 q20 2 28 -18" />
    <path d="M1530 500 h-70 M1530 500 v-70"/>
    <path d="M1530 490 q-20 2 -28 -18" />
  </g>

  <!-- world / globe motif, left -->
  <g transform="translate(250 300)" opacity="0.9">
    <circle r="92" fill="none" stroke="#D6B36D" stroke-width="1.4" opacity="0.55"/>
    <ellipse rx="92" ry="34" fill="none" stroke="#D6B36D" stroke-width="1" opacity="0.4"/>
    <ellipse rx="92" ry="34" fill="none" stroke="#D6B36D" stroke-width="1" opacity="0.4" transform="rotate(60)"/>
    <ellipse rx="92" ry="34" fill="none" stroke="#D6B36D" stroke-width="1" opacity="0.4" transform="rotate(120)"/>
    <circle r="3.2" fill="#F3E0B4"/>
    <circle cx="48" cy="-30" r="2.4" fill="#F3E0B4" opacity="0.85"/>
    <circle cx="-55" cy="22" r="2.2" fill="#F3E0B4" opacity="0.85"/>
    <circle cx="20" cy="60" r="2" fill="#F3E0B4" opacity="0.7"/>
    <path d="M0 0 L48 -30 M0 0 L-55 22 M0 0 L20 60" stroke="#D6B36D" stroke-width="0.8" opacity="0.5"/>
  </g>

  <!-- quill, right -->
  <g transform="translate(1330 290) rotate(-18)" filter="url(#softGlow)">
    <path d="M0 -140 C 26 -96 20 -40 -6 16 C -16 36 -30 50 -46 58 L -30 36 C -40 40 -50 46 -58 56 L -40 30 C -10 -2 10 -46 0 -92 C -4 -108 -2 -126 0 -140 Z"
          fill="url(#penGrad)" stroke="#8A6A2E" stroke-width="1"/>
    <path d="M-2 -132 C 10 -92 6 -44 -14 8" stroke="#8A6A2E" stroke-width="1" fill="none" opacity="0.6"/>
    <line x1="-58" y1="56" x2="-78" y2="82" stroke="#B8914A" stroke-width="3" stroke-linecap="round"/>
    <circle cx="-78" cy="82" r="2.2" fill="#F3E0B4"/>
  </g>

  <!-- wordmark -->
  <text x="800" y="298" text-anchor="middle" font-family="Georgia, 'Playfair Display', 'Times New Roman', serif"
        font-size="108" letter-spacing="14" fill="url(#goldText)" filter="url(#softGlow)">ANDERSEN</text>

  <!-- rule under wordmark -->
  <g transform="translate(800 332)">
    <line x1="-180" y1="0" x2="-30" y2="0" stroke="#D6B36D" stroke-width="1.2" opacity="0.7"/>
    <circle r="3" fill="#D6B36D"/>
    <line x1="30" y1="0" x2="180" y2="0" stroke="#D6B36D" stroke-width="1.2" opacity="0.7"/>
  </g>

  <text x="800" y="380" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="25" letter-spacing="1.5" fill="#CBD6E8">Ne csak történeteket írj. Teremts világokat.</text>

  <text x="800" y="420" text-anchor="middle" font-family="Georgia, serif" font-style="italic"
        font-size="18" letter-spacing="1" fill="#8FA3C0">Your world. Your story. Your creation.</text>
</svg>
