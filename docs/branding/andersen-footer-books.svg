<svg viewBox="0 0 1600 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Könyvespolc és gyertya — az Andersen záró illusztrációja">
  <defs>
    <linearGradient id="bgF" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1220"/>
      <stop offset="100%" stop-color="#172A42"/>
    </linearGradient>
    <radialGradient id="candleGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#F3E0B4" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#F3E0B4" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="320" fill="url(#bgF)"/>

  <!-- shelf line -->
  <rect x="200" y="250" width="1200" height="14" fill="#14233A" stroke="#D6B36D" stroke-width="1.2"/>

  <!-- row of books, varying heights/colors -->
  <g stroke="#0A1220" stroke-width="1">
    <rect x="240" y="150" width="26" height="100" fill="#2A3C58"/>
    <rect x="268" y="130" width="22" height="120" fill="#3A5A3E"/>
    <rect x="292" y="165" width="30" height="85" fill="#5B3A2E"/>
    <rect x="324" y="120" width="20" height="130" fill="#6B4A2E"/>
    <rect x="346" y="145" width="24" height="105" fill="#2A3C58"/>
    <rect x="1230" y="140" width="24" height="110" fill="#3A5A3E"/>
    <rect x="1256" y="160" width="28" height="90" fill="#5B3A2E"/>
    <rect x="1286" y="125" width="22" height="125" fill="#2A3C58"/>
    <rect x="1310" y="150" width="26" height="100" fill="#6B4A2E"/>
  </g>
  <g fill="#D6B36D" opacity="0.5">
    <rect x="250" y="160" width="6" height="3"/>
    <rect x="300" y="175" width="8" height="3"/>
    <rect x="330" y="130" width="5" height="3"/>
    <rect x="1240" y="150" width="6" height="3"/>
    <rect x="1294" y="135" width="6" height="3"/>
  </g>

  <!-- open book center stage -->
  <g transform="translate(800 230)">
    <path d="M-8 -34 C -70 -48 -130 -40 -165 -22 L -165 10 C -130 -4 -70 -10 -8 0 Z" fill="#1C2F4A" stroke="#D6B36D" stroke-width="1.4"/>
    <path d="M8 -34 C 70 -48 130 -40 165 -22 L 165 10 C 130 -4 70 -10 8 0 Z" fill="#1C2F4A" stroke="#D6B36D" stroke-width="1.4"/>
    <g stroke="#9C8A63" stroke-width="1.5" opacity="0.7">
      <line x1="-140" y1="-24" x2="-30" y2="-18"/>
      <line x1="-140" y1="-10" x2="-20" y2="-6"/>
      <line x1="30" y1="-18" x2="140" y2="-24"/>
      <line x1="20" y1="-6" x2="140" y2="-10"/>
    </g>
  </g>

  <!-- candle beside the book -->
  <g transform="translate(980 220)">
    <ellipse cx="0" cy="40" rx="90" ry="20" fill="url(#candleGlow)"/>
    <rect x="-9" y="-10" width="18" height="50" rx="3" fill="#F6EFDD"/>
    <path d="M0 -10 Q -4 -22 0 -32 Q 4 -22 0 -10 Z" fill="#F3E0B4"/>
    <path d="M0 -14 Q -2 -20 0 -26 Q 2 -20 0 -14 Z" fill="#D6793A"/>
  </g>

  <text x="800" y="60" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="18" fill="#8FA3C0">
    minden befejezett fejezet egy újabb könyv a polcon
  </text>
</svg>
