<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="t d">
<title id="t">Andersen — karakterek és kapcsolatok</title><desc id="d">Három elegáns karakterprofil-kártya és kapcsolati hálózat absztrakt, illusztratív portrékkal.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#091321"/><stop offset="1" stop-color="#1A2B41"/></linearGradient><linearGradient id="gold" x2="1"><stop stop-color="#F4E2B6"/><stop offset="1" stop-color="#B88748"/></linearGradient><linearGradient id="card" x2="0" y2="1"><stop stop-color="#20354D"/><stop offset="1" stop-color="#111D2E"/></linearGradient><radialGradient id="portrait"><stop stop-color="#C7A66A" stop-opacity=".5"/><stop offset="1" stop-color="#C7A66A" stop-opacity="0"/></radialGradient></defs>
<rect width="1200" height="500" rx="28" fill="url(#bg)"/><text x="65" y="72" fill="#D8B66F" font-family="Arial,sans-serif" font-size="12" letter-spacing="4">03 / CHARACTER ARCHIVE</text><text x="65" y="124" fill="#FFF2D7" font-family="Georgia,serif" font-size="36">Minden szereplő mögött egy világ van.</text><text x="67" y="158" fill="#AEBBCD" font-family="Arial,sans-serif" font-size="14">Motivációk. Kapcsolatok. Titkok. Változás.</text>
