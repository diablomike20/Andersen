<svg viewBox="0 0 1600 470" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Az Andersen öt összekapcsolt alkotói területe">
  <defs>
    <linearGradient id="bg8" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1220"/>
      <stop offset="100%" stop-color="#172A42"/>
    </linearGradient>
    <linearGradient id="chainGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8FA3C0" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#D6B36D" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="470" fill="url(#bg8)"/>

  <line x1="190" y1="220" x2="1410" y2="220" stroke="url(#chainGrad)" stroke-width="2"/>

  <!-- five interlocked rings -->
  <g font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="600">
    <!-- 1 Kéziratírás -->
    <g transform="translate(190 220)">
      <circle r="78" fill="#0E1A30" stroke="#D6B36D" stroke-width="2"/>
      <g stroke="#F3E0B4" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(0 -14)">
        <rect x="-16" y="-18" width="32" height="36" rx="3"/>
        <line x1="-9" y1="-8" x2="9" y2="-8"/>
        <line x1="-9" y1="0" x2="9" y2="0"/>
        <line x1="-9" y1="8" x2="4" y2="8"/>
      </g>
      <text y="42" text-anchor="middle" fill="#F3E0B4">Kéziratírás</text>
    </g>

    <!-- 2 Világépítés -->
    <g transform="translate(600 220)">
      <circle r="78" fill="#0E1A30" stroke="#D6B36D" stroke-width="2"/>
      <g stroke="#F3E0B4" stroke-width="1.6" fill="none" transform="translate(0 -14)">
        <circle r="17"/>
        <path d="M-17 0 H17 M0 -17 V17 M-12 -10 Q0 -3 12 -10 M-12 10 Q0 3 12 10"/>
      </g>
      <text y="42" text-anchor="middle" fill="#F3E0B4">Világépítés</text>
    </g>

    <!-- 3 Karakterek -->
    <g transform="translate(1000 220)">
      <circle r="78" fill="#0E1A30" stroke="#D6B36D" stroke-width="2"/>
      <g stroke="#F3E0B4" stroke-width="1.8" fill="none" stroke-linecap="round" transform="translate(0 -16)">
        <circle r="9" cx="-9" cy="-8"/>
        <circle r="9" cx="9" cy="-4"/>
        <path d="M-20 16 C -20 0 -11 -2 -9 -2" />
        <path d="M-2 18 C -2 0 9 4 9 4 C 20 4 20 16 20 16"/>
      </g>
      <text y="42" text-anchor="middle" fill="#F3E0B4">Karakterek</text>
    </g>

    <!-- 4 Cselekmény -->
    <g transform="translate(1410 220)">
      <circle r="78" fill="#0E1A30" stroke="#D6B36D" stroke-width="2"/>
      <g transform="translate(0 -16)">
        <path d="M-18 12 Q -4 -18 18 -12" stroke="#F3E0B4" stroke-width="2" fill="none" stroke-linecap="round"/>
        <circle cx="-18" cy="12" r="3.4" fill="#F3E0B4"/>
        <circle cx="18" cy="-12" r="3.4" fill="#F3E0B4"/>
        <circle cx="2" cy="-12" r="3.4" fill="#F3E0B4" opacity="0.8"/>
      </g>
      <text y="42" text-anchor="middle" fill="#F3E0B4">Cselekmény</text>
    </g>
  </g>

  <!-- a 5th element centered above the line, slightly offset for an organic non-grid feel -->
  <g transform="translate(805 330)" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="600">
    <circle r="78" fill="#0E1A30" stroke="#D6B36D" stroke-width="2"/>
    <g stroke="#F3E0B4" stroke-width="1.8" fill="none" stroke-linecap="round" transform="translate(0 -14)">
      <circle r="12" cx="-4" cy="-4"/>
      <line x1="5" y1="5" x2="16" y2="16"/>
    </g>
    <text y="42" text-anchor="middle" fill="#F3E0B4">Kutatás &amp; szerkesztés</text>
    <line x1="0" y1="-78" x2="0" y2="-110" stroke="#D6B36D" stroke-width="2.4" opacity="0.85"/>
  </g>

  <text x="800" y="60" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="18" fill="#8FA3C0">
    öt alkotói terület — egy közös munkakörnyezetben
  </text>
</svg>
