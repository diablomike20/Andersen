<svg viewBox="0 0 1600 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Az Andersen technológiai háttere">
  <defs>
    <linearGradient id="bgT" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1220"/>
      <stop offset="100%" stop-color="#172A42"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="260" fill="url(#bgT)"/>

  <line x1="100" y1="130" x2="1500" y2="130" stroke="#2A3C58" stroke-width="1" opacity="0.6"/>

  <g font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#CBD6E8" text-anchor="middle">
    <!-- React/TS -->
    <g transform="translate(220 130)">
      <circle r="52" fill="#0E1A30" stroke="#D6B36D" stroke-width="1.8"/>
      <g stroke="#F3E0B4" stroke-width="1.6" fill="none">
        <ellipse rx="26" ry="10"/>
        <ellipse rx="26" ry="10" transform="rotate(60)"/>
        <ellipse rx="26" ry="10" transform="rotate(120)"/>
        <circle r="4" fill="#F3E0B4" stroke="none"/>
      </g>
      <text y="72">React · TypeScript</text>
    </g>
    <!-- Vite -->
    <g transform="translate(560 130)">
      <circle r="52" fill="#0E1A30" stroke="#D6B36D" stroke-width="1.8"/>
      <path d="M-20 -22 L20 -22 L2 24 L-16 2 Z" fill="none" stroke="#F3E0B4" stroke-width="1.8" stroke-linejoin="round"/>
      <path d="M-4 -10 L8 -10 L-2 10 Z" fill="#F3E0B4" opacity="0.85"/>
      <text y="72">Vite</text>
    </g>
    <!-- Tauri -->
    <g transform="translate(900 130)">
      <circle r="52" fill="#0E1A30" stroke="#D6B36D" stroke-width="1.8"/>
      <circle r="20" fill="none" stroke="#F3E0B4" stroke-width="1.6"/>
      <circle r="7" cx="16" cy="-10" fill="none" stroke="#F3E0B4" stroke-width="1.6"/>
      <circle r="7" cx="-16" cy="10" fill="none" stroke="#F3E0B4" stroke-width="1.6"/>
      <text y="72">Tauri 2</text>
    </g>
    <!-- i18n -->
    <g transform="translate(1240 130)">
      <circle r="52" fill="#0E1A30" stroke="#D6B36D" stroke-width="1.8"/>
      <g stroke="#F3E0B4" stroke-width="1.4" fill="none">
        <circle r="22"/>
        <path d="M-22 0 H22 M0 -22 V22 M-15 -12 Q0 -4 15 -12 M-15 12 Q0 4 15 12"/>
      </g>
      <text y="72">Többnyelvűség</text>
    </g>
  </g>

  <text x="800" y="30" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="16" fill="#8FA3C0">a jelenlegi kódbázis fő pillérei</text>
</svg>
